name: Internal CI

# Minimal CI for our own fork (Artemedi/teamai-cli), independent of the
# inherited upstream `ci.yml`/`release.yml` (which target Tencent's release
# process and, as of this writing, have never been enabled for this fork —
# GitHub disables Actions on a repo's workflows by default for a freshly
# forked repository until a repo owner manually enables them from the
# Actions tab; there is no public REST/CLI API to do that on their behalf).
#
# Scope is deliberately small: typecheck, unit tests, build, and the Team
# Context E2E suite (real built CLI, real local git, no network) — the
# checks we actually want green before merging our own internal PRs. Not a
# release pipeline, not a copy of upstream's matrix; extend only when a real
# need shows up.

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: internal-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, unit tests, build, Team Context E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Team Context E2E
        run: npx vitest --config vitest.e2e.config.ts run src/__tests__/team-context-e2e.test.ts
